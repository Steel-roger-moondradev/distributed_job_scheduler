name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler_db
      DATABASE_URL: postgresql://scheduler:scheduler@localhost:5432/scheduler_db
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scheduler -d scheduler_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --foreground-scripts --loglevel verbose

      - name: Verify dependency versions
        run: |
          node --version
          npm --version
          npm ls esbuild vite tsx

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run TypeScript type checks
        run: npm run typecheck

      - name: Run workspace lint scripts
        run: npm run lint --workspaces --if-present

      - name: Run workspace test scripts
        run: npm run test --workspaces --if-present

      - name: Build all workspaces
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend Docker images
        run: docker compose build api scheduler worker

      - name: Audit dependencies
        run: npm audit --audit-level=high
